apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-worker
  namespace: hermes-session-cluster
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-controller
  namespace: hermes-session-cluster
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-controller
  namespace: hermes-session-cluster
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims, configmaps, secrets]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-controller
  namespace: hermes-session-cluster
subjects:
  - kind: ServiceAccount
    name: hermes-controller
    namespace: hermes-session-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-controller
